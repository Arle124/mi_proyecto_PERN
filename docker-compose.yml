services:
  db:
    image: postgres:15-alpine
    container_name: novapalma-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-novapalma}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-novapalma}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: novapalma-server
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-novapalma}?schema=public
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_change_me_in_production}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    container_name: novapalma-client
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      - server

volumes:
  postgres_data:
